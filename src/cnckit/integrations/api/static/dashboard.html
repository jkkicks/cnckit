<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNCKit Dashboard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --success: #4ecca3;
            --warning: #ffc107;
            --info: #00b4d8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--bg-card);
        }
        h1 { font-size: 1.5rem; font-weight: 600; }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
        }
        .status-dot.connected { background: var(--success); }
        .status-dot.disconnected { background: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--bg-card);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-idle { background: var(--bg-card); color: var(--text-secondary); }
        .badge-running { background: var(--success); color: var(--bg-primary); }
        .badge-paused { background: var(--warning); color: var(--bg-primary); }
        .badge-stopped { background: var(--accent); color: white; }
        .badge-pending { background: var(--info); color: var(--bg-primary); }
        .badge-completed { background: var(--success); color: var(--bg-primary); }
        .badge-failed { background: var(--accent); color: white; }
        .machine-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'SF Mono', monospace;
        }
        .progress-bar {
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 12px;
        }
        .progress-fill {
            height: 100%;
            background: var(--success);
            transition: width 0.3s ease;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: var(--success); color: var(--bg-primary); }
        .btn-pause { background: var(--warning); color: var(--bg-primary); }
        .btn-stop { background: var(--accent); color: white; }
        .job-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .job-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .job-item:last-child { margin-bottom: 0; }
        .job-info { flex: 1; }
        .job-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        .job-path {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'SF Mono', monospace;
        }
        .job-priority {
            font-size: 0.75rem;
            color: var(--info);
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .event-log {
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
            font-size: 0.75rem;
        }
        .event-item {
            padding: 8px;
            border-bottom: 1px solid var(--bg-card);
        }
        .event-item:last-child { border-bottom: none; }
        .event-time { color: var(--text-secondary); }
        .event-type { color: var(--info); font-weight: 600; }
        .ws-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CNCKit Dashboard</h1>
            <div class="status-indicator">
                <span class="status-dot" id="wsStatus"></span>
                <span id="wsStatusText">Connecting...</span>
            </div>
        </header>

        <div class="grid">
            <!-- Machine Status Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Machine Status</span>
                    <span class="badge badge-idle" id="machineState">IDLE</span>
                </div>
                <div class="machine-stats">
                    <div class="stat">
                        <div class="stat-label">X</div>
                        <div class="stat-value" id="posX">0.000</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Y</div>
                        <div class="stat-value" id="posY">0.000</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Z</div>
                        <div class="stat-value" id="posZ">0.000</div>
                    </div>
                </div>
                <div class="stat" style="margin-bottom: 12px;">
                    <div class="stat-label">Current Program</div>
                    <div class="stat-value" id="currentProgram" style="font-size: 0.875rem;">None</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Tool</div>
                    <div class="stat-value" id="currentTool">T0</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
                <div style="text-align: center; margin-top: 8px; font-size: 0.875rem;">
                    <span id="progressText">0%</span> complete
                </div>
            </div>

            <!-- Scheduler Control Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Scheduler</span>
                    <span class="badge badge-stopped" id="schedulerState">STOPPED</span>
                </div>
                <div class="stat" style="margin-bottom: 16px;">
                    <div class="stat-label">Current Job</div>
                    <div class="stat-value" id="currentJob" style="font-size: 0.875rem;">None</div>
                </div>
                <div class="controls">
                    <button class="btn-start" id="btnStart" onclick="schedulerStart()">Start</button>
                    <button class="btn-pause" id="btnPause" onclick="schedulerPause()">Pause</button>
                    <button class="btn-stop" id="btnStop" onclick="schedulerStop()">Stop</button>
                </div>
            </div>

            <!-- Job Queue Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Job Queue</span>
                    <span class="badge badge-idle" id="queueCount">0 jobs</span>
                </div>
                <div class="job-list" id="jobList">
                    <div class="empty-state">No jobs in queue</div>
                </div>
            </div>

            <!-- Event Log Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Event Log</span>
                    <span class="ws-status" id="wsInfo"></span>
                </div>
                <div class="event-log" id="eventLog">
                    <div class="empty-state">Waiting for events...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.origin;
        const WS_URL = `ws://${window.location.hostname}:8765`;

        let ws = null;
        let reconnectInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
            connectWebSocket();
            // Poll API every 2 seconds as fallback
            setInterval(refreshAll, 2000);
        });

        // API Functions
        async function apiCall(endpoint, method = 'GET') {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, { method });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API error (${endpoint}):`, error);
                return null;
            }
        }

        async function refreshAll() {
            await Promise.all([
                refreshMachine(),
                refreshQueue(),
                refreshScheduler()
            ]);
        }

        async function refreshMachine() {
            const data = await apiCall('/machine/status');
            if (!data) return;

            updateMachineUI(data);
        }

        async function refreshQueue() {
            const data = await apiCall('/queue');
            if (!data) return;

            updateQueueUI(data);
        }

        async function refreshScheduler() {
            const data = await apiCall('/scheduler/status');
            if (!data) return;

            updateSchedulerUI(data);
        }

        // Scheduler Controls
        async function schedulerStart() {
            await apiCall('/scheduler/start', 'POST');
            await refreshScheduler();
        }

        async function schedulerPause() {
            await apiCall('/scheduler/pause', 'POST');
            await refreshScheduler();
        }

        async function schedulerStop() {
            await apiCall('/scheduler/stop', 'POST');
            await refreshScheduler();
        }

        // UI Update Functions
        function updateMachineUI(data) {
            const stateEl = document.getElementById('machineState');
            stateEl.textContent = data.state.toUpperCase();
            stateEl.className = `badge badge-${data.state}`;

            document.getElementById('posX').textContent = data.position.x.toFixed(3);
            document.getElementById('posY').textContent = data.position.y.toFixed(3);
            document.getElementById('posZ').textContent = data.position.z.toFixed(3);
            document.getElementById('currentProgram').textContent = data.current_program || 'None';
            document.getElementById('currentTool').textContent = `T${data.tool}`;

            const progress = Math.round(data.progress * 100);
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${progress}%`;
        }

        function updateQueueUI(data) {
            document.getElementById('queueCount').textContent = `${data.count} jobs`;

            const listEl = document.getElementById('jobList');
            if (data.jobs.length === 0) {
                listEl.innerHTML = '<div class="empty-state">No jobs in queue</div>';
                return;
            }

            listEl.innerHTML = data.jobs.map(job => `
                <div class="job-item">
                    <div class="job-info">
                        <div class="job-name">${job.name}</div>
                        <div class="job-path">${job.path}</div>
                        ${job.priority > 0 ? `<div class="job-priority">Priority: ${job.priority}</div>` : ''}
                    </div>
                    <span class="badge badge-${job.status}">${job.status}</span>
                </div>
            `).join('');
        }

        function updateSchedulerUI(data) {
            const stateEl = document.getElementById('schedulerState');
            stateEl.textContent = data.state.toUpperCase();
            stateEl.className = `badge badge-${data.state}`;

            document.getElementById('currentJob').textContent =
                data.current_job ? data.current_job.name : 'None';

            // Update button states
            const isRunning = data.state === 'running';
            const isStopped = data.state === 'stopped';
            document.getElementById('btnStart').disabled = isRunning;
            document.getElementById('btnPause').disabled = !isRunning;
            document.getElementById('btnStop').disabled = isStopped;
        }

        // WebSocket Functions
        function connectWebSocket() {
            updateWsStatus('connecting');

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    updateWsStatus('connected');
                    addEvent('system', 'WebSocket connected');
                    if (reconnectInterval) {
                        clearInterval(reconnectInterval);
                        reconnectInterval = null;
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        handleWsMessage(msg);
                    } catch (e) {
                        console.error('WS parse error:', e);
                    }
                };

                ws.onclose = () => {
                    updateWsStatus('disconnected');
                    addEvent('system', 'WebSocket disconnected');
                    scheduleReconnect();
                };

                ws.onerror = () => {
                    updateWsStatus('disconnected');
                };
            } catch (e) {
                updateWsStatus('disconnected');
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (!reconnectInterval) {
                reconnectInterval = setInterval(() => {
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        connectWebSocket();
                    }
                }, 5000);
            }
        }

        function handleWsMessage(msg) {
            addEvent(msg.type, JSON.stringify(msg.data).substring(0, 50));

            switch (msg.type) {
                case 'machine_state':
                    updateMachineUI({
                        state: msg.data.state,
                        position: msg.data.position || {x: 0, y: 0, z: 0},
                        tool: msg.data.tool || 0,
                        current_program: msg.data.current_program,
                        progress: msg.data.progress || 0
                    });
                    break;
                case 'job_started':
                case 'job_completed':
                case 'job_failed':
                case 'queue_empty':
                    refreshQueue();
                    refreshScheduler();
                    break;
                case 'scheduler_state':
                    updateSchedulerUI(msg.data);
                    break;
            }
        }

        function updateWsStatus(status) {
            const dot = document.getElementById('wsStatus');
            const text = document.getElementById('wsStatusText');

            dot.className = `status-dot ${status}`;
            text.textContent = status === 'connected' ? 'Live' :
                              status === 'connecting' ? 'Connecting...' : 'Offline';
        }

        function addEvent(type, data) {
            const log = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();

            // Remove empty state if present
            if (log.querySelector('.empty-state')) {
                log.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'event-item';
            item.innerHTML = `<span class="event-time">${time}</span> <span class="event-type">${type}</span> ${data}`;
            log.insertBefore(item, log.firstChild);

            // Keep only last 50 events
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }
    </script>
</body>
</html>
