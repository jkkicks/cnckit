site_name: cnckit
site_description: A lightweight, modular Python framework for LinuxCNC automation
site_url: https://jacobm.github.io/cnckit
repo_url: https://github.com/jacobm/cnckit
repo_name: jacobm/cnckit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: google
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Architecture: architecture.md
  - API Reference:
      - Core:
          - Machine: api/core/machine.md
          - Job: api/core/job.md
          - Queue: api/core/queue.md
          - Scheduler: api/core/scheduler.md
          - Events: api/core/events.md
      - Integrations:
          - REST API: api/integrations/api.md
          - MQTT: api/integrations/mqtt.md
          - WebSocket: api/integrations/websocket.md
          - Robot: api/integrations/robot.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jacobm/cnckit
